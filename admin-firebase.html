<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Recitation Admin</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --yellow: #ffd43b;
      --gold: #f59e0b;
      --black: #111827;
      --ink: #0f172a;
      --muted: #64748b;
      --line: rgba(15, 23, 42, 0.12);
      --green: #16a34a;
      --red: #dc2626;
      --card: rgba(255, 255, 255, 0.94);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(255, 212, 59, 0.46), transparent 34%),
        linear-gradient(135deg, #fff7d6, #f8fafc 46%, #ffffff);
    }

    main {
      width: min(940px, 100%);
      margin: 0 auto;
      padding: 14px;
    }

    .hero,
    .panel,
    .student-card,
    .modal-card {
      border-radius: 12px;
      box-shadow: 0 16px 38px rgba(15, 23, 42, 0.10);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 18px;
      background: linear-gradient(135deg, #111827, #1f2937);
      color: white;
    }

    .eyebrow {
      display: inline-flex;
      border: 1px solid rgba(255, 212, 59, 0.36);
      border-radius: 999px;
      padding: 6px 10px;
      color: var(--yellow);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 10px 0 0;
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1;
    }

    .live-pill {
      border: 1px solid rgba(134, 239, 172, 0.48);
      border-radius: 999px;
      padding: 8px 12px;
      color: #86efac;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .hero-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      border: 1px solid rgba(255, 212, 59, 0.36);
      border-radius: 999px;
      padding: 0 13px;
      color: var(--yellow);
      text-decoration: none;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }


    .header-menu-wrap {
      position: relative;
      align-self: start;
      justify-self: end;
    }

    .heart-menu-button {
      width: 42px;
      min-height: 42px;
      border: 1px solid rgba(255, 212, 59, 0.40);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.10);
      color: var(--yellow);
      font-size: 20px;
      line-height: 1;
      box-shadow: none;
    }

    .heart-menu-button:active,
    .heart-menu-button[aria-expanded="true"] {
      background: var(--yellow);
      color: var(--black);
    }

    .heart-menu {
      position: absolute;
      top: 50px;
      right: 0;
      z-index: 60;
      width: min(320px, calc(100vw - 28px));
      border: 1px solid rgba(255, 212, 59, 0.32);
      border-radius: 16px;
      padding: 10px;
      background: rgba(17, 24, 39, 0.98);
      box-shadow: 0 20px 44px rgba(15, 23, 42, 0.30);
      color: white;
    }

    .heart-menu[hidden] {
      display: none;
    }

    .menu-home-link {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      border: 1px solid rgba(255, 212, 59, 0.30);
      border-radius: 12px;
      color: var(--yellow);
      text-decoration: none;
      font-size: 13px;
      font-weight: 950;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .heart-menu .auth-panel {
      margin: 10px 0 0;
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    .heart-menu .auth-panel .panel-title {
      color: rgba(255, 255, 255, 0.78);
    }

    .heart-menu .auth-row {
      grid-template-columns: 1fr;
      gap: 7px;
    }

    .heart-menu .auth-panel.signed-in .auth-row {
      grid-template-columns: 1fr;
    }

    .heart-menu .auth-panel label {
      color: rgba(255, 255, 255, 0.72);
    }

    .heart-menu .auth-panel input,
    .heart-menu .auth-panel button {
      min-height: 40px;
      font-size: 14px;
    }

    .heart-menu .auth-panel input {
      border-color: rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.96);
    }

    .heart-menu .auth-panel button.secondary {
      border-color: rgba(255, 212, 59, 0.35);
      background: rgba(255, 255, 255, 0.10);
      color: var(--yellow);
    }

    .credit {
      margin-top: 8px;
      color: rgba(255, 212, 59, 0.82);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .panel {
      margin-top: 12px;
      border: 1px solid var(--line);
      padding: 14px;
      background: var(--card);
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 950;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    label {
      display: block;
      margin: 0 0 6px;
      color: #475569;
      font-size: 11px;
      font-weight: 950;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    input,
    select,
    button {
      width: 100%;
      min-height: 48px;
      border-radius: 10px;
      font-size: 16px;
    }

    input,
    select {
      border: 1px solid #cbd5e1;
      padding: 11px 12px;
      background: white;
      color: var(--ink);
    }

    button {
      border: 0;
      background: var(--black);
      color: white;
      font-weight: 900;
      cursor: pointer;
    }

    button.secondary {
      border: 1px solid var(--line);
      background: white;
      color: var(--black);
    }

    button.danger {
      border: 1px solid #fecaca;
      background: #fee2e2;
      color: #991b1b;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .pin-row,
    .auth-row,
    .filter-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(150px, 0.55fr) minmax(150px, 0.55fr) auto auto auto;
      gap: 10px;
      align-items: end;
    }

    .pin-row {
      grid-template-columns: minmax(0, 1fr) 150px;
    }

    .auth-row {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto auto;
    }

    .auth-panel {
      padding: 10px;
    }

    .auth-panel .panel-title {
      margin-bottom: 8px;
      font-size: 11px;
    }

    .auth-panel input,
    .auth-panel button {
      min-height: 42px;
      font-size: 14px;
    }

    .auth-panel label {
      margin-bottom: 4px;
      font-size: 10px;
    }

    .auth-panel.signed-in .auth-field,
    .auth-panel.signed-in #signInButton {
      display: none;
    }

    .auth-panel.signed-in .auth-row {
      grid-template-columns: 1fr auto;
    }

    .add-button {
      width: 50px;
      min-height: 50px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--yellow), var(--gold));
      color: var(--black);
      font-size: 28px;
      line-height: 1;
    }

    .summary {
      display: none;
      margin-top: 10px;
      border: 1px solid rgba(245, 158, 11, 0.24);
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff7d6;
      color: #78350f;
      font-weight: 900;
      line-height: 1.35;
    }

    .result {
      display: none;
      margin-top: 12px;
      border-radius: 10px;
      padding: 12px;
      white-space: pre-line;
      text-align: center;
      font-weight: 900;
      line-height: 1.4;
    }

    .success { display: block; background: #dcfce7; color: #14532d; border: 1px solid #86efac; }
    .error { display: block; background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .loading { display: block; background: #e0f2fe; color: #075985; border: 1px solid #bae6fd; }

    .student-list {
      display: grid;
      gap: 9px;
      margin-top: 12px;
    }

    .student-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      border: 1px solid var(--line);
      padding: 12px;
      background: white;
      cursor: pointer;
    }

    .student-name {
      font-size: 16px;
      font-weight: 950;
    }

    .student-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .points {
      border-radius: 999px;
      padding: 8px 11px;
      background: #dcfce7;
      color: #166534;
      font-weight: 950;
      white-space: nowrap;
    }

    .points-editor {
      display: none;
      margin-top: 12px;
      border: 1px solid rgba(245, 158, 11, 0.26);
      border-radius: 12px;
      padding: 12px;
      background: #fff7d6;
    }

    .points-editor.active {
      display: block;
    }

    .points-editor-title {
      margin: 0 0 10px;
      color: #78350f;
      font-size: 12px;
      font-weight: 950;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .points-editor-summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .points-stat {
      border: 1px solid rgba(245, 158, 11, 0.22);
      border-radius: 10px;
      padding: 10px;
      background: white;
    }

    .points-stat span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 950;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .points-stat strong {
      display: block;
      margin-top: 4px;
      color: var(--ink);
      font-size: 20px;
      line-height: 1;
    }

    .points-adjust-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .points-adjust-button.add {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }

    .points-adjust-button.minus {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .points-help {
      margin: 8px 0 0;
      color: #92400e;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.35;
    }

    .empty {
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      padding: 18px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--muted);
      text-align: center;
      font-weight: 800;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none;
      place-items: center;
      align-items: center;
      padding: 14px;
      background: rgba(15, 23, 42, 0.58);
      overflow-y: auto;
    }

    .modal-backdrop.active {
      display: grid;
    }

    .modal-card {
      width: min(560px, 100%);
      max-height: calc(100vh - 28px);
      max-height: calc(100dvh - 28px);
      border: 1px solid rgba(255, 255, 255, 0.32);
      padding: 16px;
      background: white;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }

    .modal-header {
      position: sticky;
      top: -16px;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
      margin: -16px -16px 12px;
      padding: 16px 16px 12px;
      background: white;
      border-bottom: 1px solid rgba(15, 23, 42, 0.08);
    }

    .modal-header h2 {
      margin: 0;
      font-size: 28px;
      line-height: 1;
    }

    .close-button {
      width: 44px;
      min-height: 44px;
      border: 1px solid var(--line);
      background: white;
      color: var(--black);
      font-size: 24px;
    }

    .form-grid,
    .modal-actions {
      display: grid;
      gap: 10px;
    }

    .modal-actions {
      position: sticky;
      bottom: -16px;
      z-index: 2;
      grid-template-columns: 1fr 1fr;
      margin: 12px -16px -16px;
      padding: 12px 16px 16px;
      background: white;
      border-top: 1px solid rgba(15, 23, 42, 0.08);
    }

    .delete-button {
      grid-column: 1 / -1;
    }

    input:disabled {
      background: #f1f5f9;
      color: #64748b;
      opacity: 1;
    }

    @media (max-width: 640px) {
      main {
        padding: 10px;
      }

      .hero {
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        padding: 12px;
      }

      .eyebrow {
        padding: 4px 8px;
        font-size: 10px;
      }

      h1 {
        margin-top: 7px;
        font-size: 28px;
        line-height: 1;
      }

      .credit {
        margin-top: 6px;
        font-size: 9px;
      }

      .heart-menu-button {
        width: 38px;
        min-height: 38px;
        font-size: 18px;
      }

      .heart-menu {
        top: 44px;
      }

      .auth-row,
      .pin-row,
      .filter-row,
      .modal-actions {
        grid-template-columns: 1fr;
      }

      .modal-backdrop {
        padding: 10px;
        align-items: start;
      }

      .modal-card {
        max-height: calc(100vh - 20px);
        max-height: calc(100dvh - 20px);
        padding: 14px;
      }

      .modal-header {
        top: -14px;
        margin: -14px -14px 10px;
        padding: 14px 14px 10px;
      }

      .modal-actions {
        bottom: -14px;
        margin: 12px -14px -14px;
        padding: 10px 14px 14px;
      }

      .live-pill,
      .add-button {
        width: 100%;
      }

      .student-card {
        grid-template-columns: 1fr;
      }

      .points {
        width: fit-content;
      }

      .points-editor-summary,
      .points-adjust-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <div>
        <div class="eyebrow">Recitation Central</div>
        <h1>Admin</h1>
        <div class="credit">Developed by Mr. John Rey Tubello (Sir JR)</div>
      </div>
      <div class="header-menu-wrap">
        <button id="heartMenuButton" class="heart-menu-button" type="button" aria-label="Open admin menu" aria-expanded="false">♥</button>
        <div id="heartMenu" class="heart-menu" hidden>
          <a class="menu-home-link" href="firebase-index.html">Home</a>
          <section id="authPanel" class="auth-panel">
            <p class="panel-title">Teacher Sign In</p>
            <div class="auth-row">
              <div class="auth-field">
                <label for="teacherEmail">Email</label>
                <input id="teacherEmail" type="email" autocomplete="username" placeholder="Teacher email">
              </div>
              <div class="auth-field">
                <label for="teacherPassword">Password</label>
                <input id="teacherPassword" type="password" autocomplete="current-password" placeholder="Password">
              </div>
              <button id="signInButton" type="button">Sign In</button>
              <button id="signOutButton" class="secondary" type="button" hidden>Sign Out</button>
            </div>
          </section>
        </div>
      </div>
    </header>

    <div id="result" class="result"></div>

    <section id="adminPanel" class="panel" hidden>
      <div class="panel-title">
        <span>Students</span>
        <button id="openModalButton" class="add-button" type="button" aria-label="Add student">+</button>
      </div>

      <div class="filter-row">
        <div>
          <label for="sectionFilter">Section</label>
          <select id="sectionFilter">
            <option value="">All sections</option>
          </select>
        </div>
        <div>
          <label for="sortSelect">Sort</label>
          <select id="sortSelect">
            <option value="pointsDesc">Most Points</option>
            <option value="latest">Latest Recitation</option>
            <option value="az">Name A-Z</option>
            <option value="pointsAsc">Lowest Points</option>
          </select>
        </div>
        <div>
          <label for="termSelect">Term</label>
          <select id="termSelect">
            <option value="current">Current Term</option>
            <option value="term1">Term 1</option>
            <option value="term2">Term 2</option>
            <option value="term3">Term 3</option>
            <option value="allTime">All Time</option>
          </select>
        </div>
        <button id="refreshButton" class="secondary" type="button">Reconnect</button>
        <button id="exportButton" class="secondary" type="button">Export Totals XLSX</button>
        <button id="exportLogsButton" class="secondary" type="button">Export Logs</button>
      </div>

      <div style="margin-top: 10px;">
        <label for="searchInput">Search</label>
        <input id="searchInput" type="search" placeholder="Search student name or ID">
      </div>

      <div id="summary" class="summary"></div>
      <div id="studentList" class="student-list"></div>
    </section>
  </main>

  <div id="studentModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle">Add Student</h2>
        <button id="closeModalButton" class="close-button" type="button">x</button>
      </div>

      <div class="form-grid">
        <div>
          <label for="studentIdInput">Student ID</label>
          <input id="studentIdInput" type="text" placeholder="Student ID">
        </div>
        <div>
          <label for="fullNameInput">Full Name</label>
          <input id="fullNameInput" type="text" placeholder="Full Name">
        </div>
        <div>
          <label for="sectionInput">Section</label>
          <input id="sectionInput" type="text" list="sectionOptions" placeholder="Section">
          <datalist id="sectionOptions"></datalist>
        </div>
        <div>
          <label for="genderInput">Gender</label>
          <select id="genderInput">
            <option value="">Not set</option>
            <option value="Male">Male / Boy</option>
            <option value="Female">Female / Girl</option>
          </select>
        </div>
      </div>

      <section id="pointsEditor" class="points-editor" aria-label="Edit student points">
        <p class="points-editor-title">Edit Points</p>
        <div class="points-editor-summary">
          <div class="points-stat">
            <span id="pointsTermLabel">Selected Term</span>
            <strong id="currentTermPoints">0 pts</strong>
          </div>
          <div class="points-stat">
            <span>All Time Total</span>
            <strong id="currentTotalPoints">0 pts</strong>
          </div>
        </div>
        <div>
          <label for="pointsAdjustInput">Custom Point Change</label>
          <input id="pointsAdjustInput" type="number" step="1" placeholder="Example: 1 or -1">
        </div>
        <div class="points-adjust-row">
          <button id="subtractPointButton" class="points-adjust-button minus" type="button">-1 Point</button>
          <button id="addPointButton" class="points-adjust-button add" type="button">+1 Point</button>
        </div>
        <button id="applyPointsButton" class="secondary" type="button" style="margin-top: 8px;">Apply Custom Change</button>
        <p class="points-help">Every point edit asks for confirmation first and is saved as an admin adjustment log.</p>
      </section>

      <div class="modal-actions">
        <button id="addButton" type="button">Add Student</button>
        <button id="saveButton" class="secondary" type="button">Save Edit</button>
        <button id="deleteButton" class="danger delete-button" type="button">Delete Student</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      collection,
      deleteDoc,
      doc,
      getDocs,
      getFirestore,
      onSnapshot,
      orderBy,
      query,
      serverTimestamp,
      setDoc,
      writeBatch
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBbY8IScU02QfS9Xda175wIJ2dUjrJTIo4",
      authDomain: "recitation-central.firebaseapp.com",
      projectId: "recitation-central",
      storageBucket: "recitation-central.firebasestorage.app",
      messagingSenderId: "805395065834",
      appId: "1:805395065834:web:2e71c87ab0578ef4df6093",
      measurementId: "G-BN4V8X3JE5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const authPanel = document.getElementById("authPanel");
    const teacherEmail = document.getElementById("teacherEmail");
    const teacherPassword = document.getElementById("teacherPassword");
    const signInButton = document.getElementById("signInButton");
    const signOutButton = document.getElementById("signOutButton");
    const heartMenuButton = document.getElementById("heartMenuButton");
    const heartMenu = document.getElementById("heartMenu");
    const adminPanel = document.getElementById("adminPanel");
    const resultBox = document.getElementById("result");
    const sectionFilter = document.getElementById("sectionFilter");
    const sortSelect = document.getElementById("sortSelect");
    const termSelect = document.getElementById("termSelect");
    const searchInput = document.getElementById("searchInput");
    const refreshButton = document.getElementById("refreshButton");
    const exportButton = document.getElementById("exportButton");
    const exportLogsButton = document.getElementById("exportLogsButton");
    const summary = document.getElementById("summary");
    const studentList = document.getElementById("studentList");
    const openModalButton = document.getElementById("openModalButton");
    const studentModal = document.getElementById("studentModal");
    const modalTitle = document.getElementById("modalTitle");
    const closeModalButton = document.getElementById("closeModalButton");
    const studentIdInput = document.getElementById("studentIdInput");
    const fullNameInput = document.getElementById("fullNameInput");
    const sectionInput = document.getElementById("sectionInput");
    const genderInput = document.getElementById("genderInput");
    const sectionOptions = document.getElementById("sectionOptions");
    const addButton = document.getElementById("addButton");
    const saveButton = document.getElementById("saveButton");
    const deleteButton = document.getElementById("deleteButton");
    const pointsEditor = document.getElementById("pointsEditor");
    const pointsTermLabel = document.getElementById("pointsTermLabel");
    const currentTermPoints = document.getElementById("currentTermPoints");
    const currentTotalPoints = document.getElementById("currentTotalPoints");
    const pointsAdjustInput = document.getElementById("pointsAdjustInput");
    const subtractPointButton = document.getElementById("subtractPointButton");
    const addPointButton = document.getElementById("addPointButton");
    const applyPointsButton = document.getElementById("applyPointsButton");

    let allStudents = [];
    let allSections = [];
    let selectedStudent = null;
    let unsubscribeStudents = null;
    let unsubscribeSections = null;

    function setHeartMenu(open) {
      heartMenu.hidden = !open;
      heartMenuButton.setAttribute("aria-expanded", open ? "true" : "false");
    }

    function toggleHeartMenu() {
      setHeartMenu(heartMenu.hidden);
    }

    function showResult(type, message) {
      resultBox.className = "result " + type;
      resultBox.textContent = message;
    }

    function hideResult() {
      resultBox.className = "result";
      resultBox.textContent = "";
    }

    function normalizeId(value) {
      return String(value || "").trim();
    }

    function normalizeSectionId(sectionName) {
      return String(sectionName || "").trim().replace(/[\/\\#?[\]]/g, "-");
    }

    function normalizeGender(value) {
      const text = String(value || "").trim().toLowerCase();
      if (["male", "m", "boy", "boys", "lalaki"].includes(text)) return "Male";
      if (["female", "f", "girl", "girls", "babae"].includes(text)) return "Female";
      return "";
    }

    function genderRank(value) {
      const gender = normalizeGender(value);
      if (gender === "Male") return 0;
      if (gender === "Female") return 1;
      return 2;
    }

    function compareForClassRecord(a, b) {
      const genderDifference = genderRank(a.gender) - genderRank(b.gender);
      if (genderDifference) return genderDifference;

      return a.fullName.localeCompare(b.fullName) ||
        a.studentId.localeCompare(b.studentId);
    }

    function safeSheetName(value, fallback) {
      const cleaned = String(value || fallback || "Section")
        .replace(/[:\\/?*[\]]/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .slice(0, 31);
      return cleaned || fallback || "Section";
    }

    function getSchoolYear(date) {
      const year = date.getFullYear();
      const month = date.getMonth() + 1;
      if (month >= 1 && month <= 4) return (year - 1) + "-" + year;
      return year + "-" + (year + 1);
    }

    function getTermInfo(date = new Date()) {
      const monthDay = (date.getMonth() + 1) * 100 + date.getDate();
      const schoolYear = getSchoolYear(date);

      if (monthDay >= 601 && monthDay <= 906) {
        return { id: "term1", name: "Term 1", schoolYear };
      }

      if (monthDay >= 907 && monthDay <= 1215) {
        return { id: "term2", name: "Term 2", schoolYear };
      }

      if (monthDay >= 104 && monthDay <= 403) {
        return { id: "term3", name: "Term 3", schoolYear };
      }

      return { id: "outOfTerm", name: "Outside Term", schoolYear };
    }

    function selectedTermId() {
      const value = termSelect.value;
      if (value === "current") return getTermInfo().id;
      return value;
    }

    function selectedTermLabel() {
      const value = termSelect.value;
      if (value === "current") return getTermInfo().name;
      if (value === "term1") return "Term 1";
      if (value === "term2") return "Term 2";
      if (value === "term3") return "Term 3";
      return "All Time";
    }

    function pointsFor(student) {
      const termId = selectedTermId();
      if (termId === "allTime") return Number(student.totalPoints) || 0;

      const termTotals = student.termTotals || {};
      const explicitTermPoints = Number(termTotals[termId]) || 0;
      const assignedTermPoints = ["term1", "term2", "term3", "outOfTerm"].reduce((total, key) => {
        return total + (Number(termTotals[key]) || 0);
      }, 0);
      const legacyUnassignedPoints = Math.max(0, (Number(student.totalPoints) || 0) - assignedTermPoints);

      if (termId === "term1") {
        return explicitTermPoints + legacyUnassignedPoints;
      }

      return explicitTermPoints;
    }

    function effectiveEditTerm() {
      const selected = selectedTermId();
      if (selected && selected !== "allTime") {
        return {
          id: selected,
          name: selectedTermLabel(),
          schoolYear: getTermInfo().schoolYear
        };
      }

      const current = getTermInfo();
      return {
        id: current.id,
        name: current.name + " (Current Term)",
        schoolYear: current.schoolYear
      };
    }

    function explicitTermPointsFor(student, termId) {
      const termTotals = student && student.termTotals ? student.termTotals : {};
      return Number(termTotals[termId]) || 0;
    }

    function editableTermPointsFor(student, termId) {
      if (!student) return 0;
      if (termId === "allTime") return Number(student.totalPoints) || 0;

      const termTotals = student.termTotals || {};
      const explicitTermPoints = Number(termTotals[termId]) || 0;

      if (termId === "term1") {
        const assignedTermPoints = ["term1", "term2", "term3", "outOfTerm"].reduce((total, key) => {
          return total + (Number(termTotals[key]) || 0);
        }, 0);
        const legacyUnassignedPoints = Math.max(0, (Number(student.totalPoints) || 0) - assignedTermPoints);
        return explicitTermPoints + legacyUnassignedPoints;
      }

      return explicitTermPoints;
    }

    function formatPoints(value) {
      const points = Number(value) || 0;
      return points + " pt" + (Math.abs(points) === 1 ? "" : "s");
    }

    function refreshPointsEditor() {
      if (!selectedStudent) return;

      const latestStudent = allStudents.find((student) => student.studentId === selectedStudent.studentId) || selectedStudent;
      selectedStudent = latestStudent;

      const term = effectiveEditTerm();
      pointsTermLabel.textContent = term.name;
      currentTermPoints.textContent = formatPoints(editableTermPointsFor(latestStudent, term.id));
      currentTotalPoints.textContent = formatPoints(latestStudent.totalPoints);
    }

    function latestMillis(student) {
      return Number(student.latestRecitationMillis || 0);
    }

    function formatTimestamp(value) {
      if (!value || typeof value.toMillis !== "function") {
        return { millis: 0, text: "" };
      }

      const millis = value.toMillis();
      return {
        millis,
        text: new Date(millis).toLocaleString([], {
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        })
      };
    }

    function formatCsvTimestamp(value) {
      let date = null;

      if (value && typeof value.toDate === "function") {
        date = value.toDate();
      } else if (value && typeof value.toMillis === "function") {
        date = new Date(value.toMillis());
      } else if (value) {
        date = new Date(value);
      }

      if (!date || Number.isNaN(date.getTime())) {
        return "";
      }

      return date.toLocaleString("en-PH", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    function normalizeStudent(docSnap) {
      const data = docSnap.data() || {};
      const latest = formatTimestamp(data.latestAt);

      return {
        studentId: normalizeId(data.studentId || docSnap.id),
        fullName: normalizeId(data.fullName),
        section: normalizeId(data.section),
        gender: normalizeGender(data.gender || data.sex || data.genderIdentity),
        totalPoints: Number(data.totalPoints) || 0,
        termTotals: data.termTotals || {},
        latestPoints: Number(data.latestPoints) || 0,
        latestRecitationMillis: latest.millis,
        latestRecitationText: latest.text
      };
    }

    function renderSections() {
      const current = sectionFilter.value;
      sectionFilter.innerHTML = '<option value="">All sections</option>';
      sectionOptions.innerHTML = "";

      allSections.forEach((sectionName) => {
        const option = document.createElement("option");
        option.value = sectionName;
        option.textContent = sectionName;
        sectionFilter.appendChild(option);

        const dataOption = document.createElement("option");
        dataOption.value = sectionName;
        sectionOptions.appendChild(dataOption);
      });

      sectionFilter.value = allSections.includes(current) ? current : "";
    }

    function getVisibleStudents() {
      const selectedSection = sectionFilter.value;
      const searchText = searchInput.value.trim().toLowerCase();
      const sortValue = sortSelect.value;

      let students = allStudents.filter((student) => {
        if (selectedSection && student.section !== selectedSection) return false;
        if (!searchText) return true;
        return [student.studentId, student.fullName, student.section, student.gender].join(" ").toLowerCase().includes(searchText);
      });

      students = students.slice();

      if (sortValue === "latest") {
        students.sort((a, b) => latestMillis(b) - latestMillis(a) || a.fullName.localeCompare(b.fullName));
      } else if (sortValue === "pointsAsc") {
        students.sort((a, b) => pointsFor(a) - pointsFor(b) || a.fullName.localeCompare(b.fullName));
      } else if (sortValue === "az") {
        students.sort((a, b) => a.fullName.localeCompare(b.fullName));
      } else {
        students.sort((a, b) => pointsFor(b) - pointsFor(a) || latestMillis(b) - latestMillis(a) || a.fullName.localeCompare(b.fullName));
      }

      return students;
    }

    function renderSummary(students) {
      if (!students.length) {
        summary.style.display = "none";
        summary.textContent = "";
        return;
      }

      const topStudent = students.reduce((top, student) => {
        return !top || pointsFor(student) > pointsFor(top) ? student : top;
      }, null);

      const latestStudent = students.slice().sort((a, b) => latestMillis(b) - latestMillis(a))[0];
      const latestText = latestStudent && latestMillis(latestStudent)
        ? " | Latest: " + latestStudent.fullName
        : "";

      summary.style.display = "block";
      summary.textContent = students.length + " student(s) shown | " + selectedTermLabel() + " | Top: " +
        topStudent.fullName + " (" + pointsFor(topStudent) + " pts)" + latestText;
    }

    function renderStudents() {
      const students = getVisibleStudents();
      renderSummary(students);
      studentList.innerHTML = "";

      if (!students.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No students found.";
        studentList.appendChild(empty);
        return;
      }

      const fragment = document.createDocumentFragment();

      students.forEach((student) => {
        const card = document.createElement("div");
        const details = document.createElement("div");
        const name = document.createElement("div");
        const meta = document.createElement("div");
        const points = document.createElement("div");

        card.className = "student-card";
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        name.className = "student-name";
        meta.className = "student-meta";
        points.className = "points";

        name.textContent = student.fullName;
        meta.textContent = student.studentId + " | " + student.section +
          (student.gender ? " | " + student.gender : "") +
          (student.latestRecitationText ? "\nLatest: " + student.latestRecitationText : "");
        points.textContent = pointsFor(student) + " pts";

        details.appendChild(name);
        details.appendChild(meta);
        card.appendChild(details);
        card.appendChild(points);

        card.addEventListener("click", () => openModal("edit", student));
        card.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openModal("edit", student);
          }
        });

        fragment.appendChild(card);
      });

      studentList.appendChild(fragment);
    }

    function csvCell(value) {
      const text = String(value ?? "");
      return /[",\n\r]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
    }

    function exportAllStudents() {
      const students = allStudents.slice();

      if (!students.length) {
        showResult("error", "No students to export.");
        return;
      }

      if (!window.XLSX) {
        showResult("error", "Excel export library did not load. Check internet connection, then try again.");
        return;
      }

      const workbook = XLSX.utils.book_new();
      const sections = Array.from(new Set(students.map((student) => student.section || "No Section"))).sort();

      sections.forEach((sectionName, index) => {
        const sectionStudents = students
          .filter((student) => (student.section || "No Section") === sectionName)
          .sort(compareForClassRecord);

        const rows = [
          ["Student ID", "Full Name", "Points", "Gender", "Latest Points", "Latest Recitation"],
          ...sectionStudents.map((student) => [
            student.studentId,
            student.fullName,
            pointsFor(student),
            normalizeGender(student.gender) || "Not set",
            student.latestPoints,
            student.latestRecitationText
          ])
        ];

        const worksheet = XLSX.utils.aoa_to_sheet(rows);
        worksheet["!cols"] = [
          { wch: 16 },
          { wch: 34 },
          { wch: 10 },
          { wch: 12 },
          { wch: 14 },
          { wch: 24 }
        ];
        XLSX.utils.book_append_sheet(workbook, worksheet, safeSheetName(sectionName, "Section " + (index + 1)));
      });

      const arrayBuffer = XLSX.write(workbook, { bookType: "xlsx", type: "array" });
      const blob = new Blob([arrayBuffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "recitation-totals-" + selectedTermLabel().toLowerCase().replace(/\s+/g, "-") + "-" + new Date().toISOString().slice(0, 10) + ".xlsx";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);

      showResult("success", "Exported " + selectedTermLabel() + " totals: " + students.length + " student(s), separated by section tabs.");
    }

    async function exportAllLogs() {
      if (!auth.currentUser) {
        showResult("error", "Please sign in first.");
        return;
      }

      exportLogsButton.disabled = true;
      showResult("loading", "Preparing full recitation logs export...");

      try {
        const snapshot = await getDocs(collection(db, "recitationLogs"));
        const logs = snapshot.docs
          .map((docSnap) => docSnap.data() || {})
          .sort((a, b) => {
            const bTime = b.createdAt && typeof b.createdAt.toMillis === "function" ? b.createdAt.toMillis() : 0;
            const aTime = a.createdAt && typeof a.createdAt.toMillis === "function" ? a.createdAt.toMillis() : 0;
            return bTime - aTime;
          });

        const rows = [
          ["Date/Time", "School Year", "Term", "Section", "Student ID", "Full Name", "Points", "Activity"],
          ...logs.map((log) => [
            formatCsvTimestamp(log.createdAt),
            log.schoolYear || "",
            log.termName || "",
            log.section || "",
            log.studentId || "",
            log.fullName || "",
            Number(log.points) || 0,
            log.activity || ""
          ])
        ];

        const csv = rows.map((row) => row.map(csvCell).join(",")).join("\n");
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download = "recitation-full-logs-" + new Date().toISOString().slice(0, 10) + ".csv";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);

        showResult("success", "Exported full recitation logs: " + snapshot.size + " record(s).");
      } catch (error) {
        showResult("error", "Logs export failed:\n" + error.message);
      } finally {
        exportLogsButton.disabled = false;
      }
    }

    function openModal(mode, student) {
      const isEdit = mode === "edit";
      selectedStudent = isEdit && student ? student : null;
      modalTitle.textContent = isEdit ? "Edit Student" : "Add Student";
      addButton.style.display = isEdit ? "none" : "block";
      saveButton.style.display = isEdit ? "block" : "none";
      deleteButton.style.display = isEdit ? "block" : "none";
      pointsEditor.classList.toggle("active", isEdit);
      studentIdInput.disabled = isEdit;
      pointsAdjustInput.value = "";

      if (isEdit && student) {
        studentIdInput.value = student.studentId;
        fullNameInput.value = student.fullName;
        sectionInput.value = student.section;
        genderInput.value = student.gender || "";
        refreshPointsEditor();
      } else {
        studentIdInput.value = "";
        fullNameInput.value = "";
        sectionInput.value = sectionFilter.value || "";
        genderInput.value = "";
      }

      studentModal.classList.add("active");
      studentModal.setAttribute("aria-hidden", "false");
      setTimeout(() => (isEdit ? fullNameInput : studentIdInput).focus(), 50);
    }

    function closeModal() {
      studentModal.classList.remove("active");
      studentModal.setAttribute("aria-hidden", "true");
      studentIdInput.disabled = false;
      selectedStudent = null;
      pointsAdjustInput.value = "";
    }

    async function saveStudent(mode) {
      const studentId = normalizeId(studentIdInput.value);
      const fullName = normalizeId(fullNameInput.value);
      const section = normalizeId(sectionInput.value);
      const gender = normalizeGender(genderInput.value);

      if (!studentId || !fullName || !section) {
        showResult("error", "Student ID, full name, and section are required.");
        return;
      }

      addButton.disabled = true;
      saveButton.disabled = true;
      showResult("loading", "Saving student...");

      try {
        const studentPayload = {
          studentId,
          fullName,
          section,
          gender,
          updatedAt: serverTimestamp()
        };

        if (mode === "add") {
          studentPayload.totalPoints = 0;
          studentPayload.termTotals = {
            term1: 0,
            term2: 0,
            term3: 0,
            outOfTerm: 0
          };
        }

        await setDoc(doc(db, "students", studentId), studentPayload, { merge: true });

        await setDoc(doc(db, "sections", normalizeSectionId(section)), {
          name: section,
          updatedAt: serverTimestamp()
        }, { merge: true });

        closeModal();
        showResult("success", (mode === "add" ? "Added: " : "Updated: ") + fullName);
      } catch (error) {
        showResult("error", "Save failed:\n" + error.message);
      } finally {
        addButton.disabled = false;
        saveButton.disabled = false;
      }
    }

    async function adjustStudentPoints(delta) {
      if (!auth.currentUser) {
        showResult("error", "Please sign in first.");
        return;
      }

      if (!selectedStudent) {
        showResult("error", "Please select a student first.");
        return;
      }

      const pointChange = Number(delta);
      if (!Number.isFinite(pointChange) || pointChange === 0 || !Number.isInteger(pointChange)) {
        showResult("error", "Enter a whole number point change, like 1 or -1.");
        return;
      }

      const studentId = normalizeId(selectedStudent.studentId);
      const fullName = normalizeId(fullNameInput.value) || selectedStudent.fullName || studentId;
      const section = normalizeId(sectionInput.value) || selectedStudent.section || "";
      const gender = normalizeGender(genderInput.value) || selectedStudent.gender || "";
      const term = effectiveEditTerm();
      const currentTermTotal = editableTermPointsFor(selectedStudent, term.id);
      const currentAllTimeTotal = Number(selectedStudent.totalPoints) || 0;
      const newTermTotal = currentTermTotal + pointChange;
      const newAllTimeTotal = currentAllTimeTotal + pointChange;

      if (newTermTotal < 0 || newAllTimeTotal < 0) {
        showResult("error", "Cannot subtract more points than the student currently has for " + term.name + ".");
        return;
      }

      const actionText = pointChange > 0 ? "ADD" : "SUBTRACT";
      const absChange = Math.abs(pointChange);
      const confirmed = confirm(
        actionText + " " + absChange + " point" + (absChange === 1 ? "" : "s") + " " +
        (pointChange > 0 ? "to " : "from ") + fullName + "?\n\n" +
        "Term: " + term.name + "\n" +
        "Term points: " + currentTermTotal + " -> " + newTermTotal + "\n" +
        "All time total: " + currentAllTimeTotal + " -> " + newAllTimeTotal
      );

      if (!confirmed) return;

      const buttonsToDisable = [addButton, saveButton, deleteButton, subtractPointButton, addPointButton, applyPointsButton];
      buttonsToDisable.forEach((button) => (button.disabled = true));
      showResult("loading", "Updating points...");

      try {
        const studentRef = doc(db, "students", studentId);
        const logRef = doc(collection(db, "recitationLogs"));
        const termField = "termTotals." + term.id;
        const batch = writeBatch(db);

        batch.update(studentRef, {
          fullName,
          section,
          gender,
          totalPoints: newAllTimeTotal,
          [termField]: newTermTotal,
          latestAt: serverTimestamp(),
          latestPoints: pointChange,
          latestTermId: term.id,
          latestTermName: term.name,
          updatedAt: serverTimestamp()
        });

        batch.set(logRef, {
          studentId,
          fullName,
          section,
          points: pointChange,
          activity: "Admin point edit",
          termId: term.id,
          termName: term.name,
          schoolYear: term.schoolYear,
          adminAdjustment: true,
          adjustedBy: auth.currentUser.email || "",
          createdAt: serverTimestamp()
        });

        await batch.commit();
        pointsAdjustInput.value = "";
        selectedStudent = {
          ...selectedStudent,
          fullName,
          section,
          gender,
          totalPoints: newAllTimeTotal,
          termTotals: {
            ...(selectedStudent.termTotals || {}),
            [term.id]: newTermTotal
          },
          latestPoints: pointChange
        };
        refreshPointsEditor();
        showResult("success", "Points updated: " + fullName + " " + (pointChange > 0 ? "+" : "") + pointChange + " | " + term.name);
      } catch (error) {
        showResult("error", "Point edit failed:\n" + error.message);
      } finally {
        buttonsToDisable.forEach((button) => (button.disabled = false));
      }
    }

    async function deleteStudent() {
      const studentId = normalizeId(studentIdInput.value);
      const fullName = normalizeId(fullNameInput.value);

      if (!studentId) {
        showResult("error", "No student selected.");
        return;
      }

      const confirmed = confirm(
        "Delete " + (fullName || studentId) + " from the student list?\n\n" +
        "This removes the student profile only. Existing recitation logs will stay."
      );

      if (!confirmed) return;

      addButton.disabled = true;
      saveButton.disabled = true;
      deleteButton.disabled = true;
      showResult("loading", "Deleting student...");

      try {
        await deleteDoc(doc(db, "students", studentId));
        closeModal();
        showResult("success", "Deleted: " + (fullName || studentId));
      } catch (error) {
        showResult("error", "Delete failed:\n" + error.message);
      } finally {
        addButton.disabled = false;
        saveButton.disabled = false;
        deleteButton.disabled = false;
      }
    }

    function subscribeData() {
      if (!auth.currentUser) {
        showResult("error", "Please sign in first.");
        return;
      }

      showResult("loading", "Connecting...");

      if (unsubscribeStudents) unsubscribeStudents();
      if (unsubscribeSections) unsubscribeSections();

      unsubscribeSections = onSnapshot(query(collection(db, "sections"), orderBy("name")), (snapshot) => {
        allSections = snapshot.docs
          .map((docSnap) => normalizeId((docSnap.data() || {}).name || docSnap.id))
          .filter(Boolean);
        renderSections();
        hideResult();
      }, (error) => showResult("error", "Sections error:\n" + error.message));

      unsubscribeStudents = onSnapshot(query(collection(db, "students")), (snapshot) => {
        allStudents = snapshot.docs.map(normalizeStudent);
        renderStudents();
        if (selectedStudent && studentModal.classList.contains("active")) {
          refreshPointsEditor();
        }
        hideResult();
      }, (error) => showResult("error", "Students error:\n" + error.message));
    }

    async function signInTeacher() {
      const email = teacherEmail.value.trim();
      const password = teacherPassword.value;

      if (!email || !password) {
        showResult("error", "Teacher email and password are required.");
        return;
      }

      signInButton.disabled = true;
      showResult("loading", "Signing in...");

      try {
        await signInWithEmailAndPassword(auth, email, password);
        setHeartMenu(false);
        teacherPassword.value = "";
      } catch (error) {
        showResult("error", "Sign in failed:\n" + error.message);
      } finally {
        signInButton.disabled = false;
      }
    }

    async function signOutTeacher() {
      if (unsubscribeStudents) unsubscribeStudents();
      if (unsubscribeSections) unsubscribeSections();
      unsubscribeStudents = null;
      unsubscribeSections = null;
      adminPanel.hidden = true;
      setHeartMenu(false);
      await signOut(auth);
    }

    onAuthStateChanged(auth, (user) => {
      const signedIn = Boolean(user);
      authPanel.classList.toggle("signed-in", signedIn);
      signOutButton.hidden = !signedIn;
      signInButton.hidden = signedIn;
      teacherEmail.disabled = signedIn;
      teacherPassword.disabled = signedIn;

      if (signedIn) {
        adminPanel.hidden = false;
        showResult("success", "Signed in: " + user.email);
        subscribeData();
      } else {
        hideResult();
        adminPanel.hidden = true;
      }
    });

    heartMenuButton.addEventListener("click", (event) => {
      event.stopPropagation();
      toggleHeartMenu();
    });

    heartMenu.addEventListener("click", (event) => {
      event.stopPropagation();
    });

    document.addEventListener("click", () => {
      setHeartMenu(false);
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") setHeartMenu(false);
    });

    signInButton.addEventListener("click", signInTeacher);
    signOutButton.addEventListener("click", signOutTeacher);
    teacherPassword.addEventListener("keydown", (event) => {
      if (event.key === "Enter") signInTeacher();
    });
    openModalButton.addEventListener("click", () => openModal("add"));
    closeModalButton.addEventListener("click", closeModal);
    studentModal.addEventListener("click", (event) => {
      if (event.target === studentModal) closeModal();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && studentModal.classList.contains("active")) {
        closeModal();
      }
    });
    addButton.addEventListener("click", () => saveStudent("add"));
    saveButton.addEventListener("click", () => saveStudent("edit"));
    deleteButton.addEventListener("click", deleteStudent);
    subtractPointButton.addEventListener("click", () => adjustStudentPoints(-1));
    addPointButton.addEventListener("click", () => adjustStudentPoints(1));
    applyPointsButton.addEventListener("click", () => adjustStudentPoints(Number(pointsAdjustInput.value)));
    pointsAdjustInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") adjustStudentPoints(Number(pointsAdjustInput.value));
    });
    sectionFilter.addEventListener("change", renderStudents);
    sortSelect.addEventListener("change", renderStudents);
    termSelect.addEventListener("change", () => {
      renderStudents();
      if (selectedStudent && studentModal.classList.contains("active")) refreshPointsEditor();
    });
    searchInput.addEventListener("input", renderStudents);
    refreshButton.addEventListener("click", subscribeData);
    exportButton.addEventListener("click", exportAllStudents);
    exportLogsButton.addEventListener("click", exportAllLogs);
  </script>
</body>
</html>
