<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Recitation Scanner</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      --yellow: #ffd43b;
      --gold: #f59e0b;
      --black: #111827;
      --ink: #0f172a;
      --muted: #64748b;
      --line: rgba(15, 23, 42, 0.12);
      --green: #16a34a;
      --red: #dc2626;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(255, 212, 59, 0.46), transparent 34%),
        linear-gradient(135deg, #fff7d6, #f8fafc 46%, #ffffff);
    }

    main {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 14px;
    }

    .hero,
    .panel {
      border-radius: 12px;
      box-shadow: 0 16px 38px rgba(15, 23, 42, 0.10);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
      padding: 18px;
      background: linear-gradient(135deg, #111827, #1f2937);
      color: white;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      border: 1px solid rgba(255, 212, 59, 0.36);
      border-radius: 999px;
      padding: 0 13px;
      color: var(--yellow);
      text-decoration: none;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .header-menu-wrap {
      position: relative;
      align-self: start;
      justify-self: end;
    }

    .heart-menu-button {
      width: 42px;
      min-height: 42px;
      border: 1px solid rgba(255, 212, 59, 0.40);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.10);
      color: var(--yellow);
      font-size: 20px;
      line-height: 1;
      box-shadow: none;
    }

    .heart-menu-button:active,
    .heart-menu-button[aria-expanded="true"] {
      background: var(--yellow);
      color: var(--black);
    }

    .heart-menu {
      position: absolute;
      top: 50px;
      right: 0;
      z-index: 30;
      width: min(300px, calc(100vw - 28px));
      border: 1px solid rgba(255, 212, 59, 0.32);
      border-radius: 16px;
      padding: 10px;
      background: rgba(17, 24, 39, 0.98);
      box-shadow: 0 20px 44px rgba(15, 23, 42, 0.30);
      color: white;
    }

    .heart-menu[hidden] {
      display: none;
    }

    .menu-home-link {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      border: 1px solid rgba(255, 212, 59, 0.30);
      border-radius: 12px;
      color: var(--yellow);
      text-decoration: none;
      font-size: 13px;
      font-weight: 950;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .heart-menu .auth-panel {
      margin: 10px 0 0;
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    .heart-menu .auth-title {
      color: rgba(255, 255, 255, 0.78);
    }

    .heart-menu .auth-grid {
      grid-template-columns: 1fr;
      gap: 7px;
    }

    .heart-menu .auth-panel label {
      color: rgba(255, 255, 255, 0.72);
    }

    .heart-menu .auth-panel input,
    .heart-menu .auth-panel button {
      min-height: 40px;
      font-size: 14px;
    }

    .heart-menu .auth-panel input {
      border-color: rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.96);
    }

    .heart-menu .auth-panel button.secondary {
      border-color: rgba(255, 212, 59, 0.35);
      background: rgba(255, 255, 255, 0.10);
      color: var(--yellow);
    }

    .heart-menu .auth-panel .result {
      margin-top: 8px;
      padding: 8px;
      font-size: 12px;
    }

    .credit {
      margin-top: 8px;
      color: rgba(255, 212, 59, 0.82);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .eyebrow {
      display: inline-flex;
      border: 1px solid rgba(255, 212, 59, 0.36);
      border-radius: 999px;
      padding: 6px 10px;
      color: var(--yellow);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 10px 0 0;
      font-size: 36px;
      line-height: 1;
    }

    .panel {
      margin-top: 12px;
      border: 1px solid var(--line);
      padding: 14px;
      background: rgba(255, 255, 255, 0.94);
    }

    label {
      display: block;
      margin: 0 0 7px;
      color: #475569;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    input,
    button {
      width: 100%;
      min-height: 52px;
      border-radius: 10px;
      font-size: 17px;
    }

    input {
      border: 1px solid #cbd5e1;
      padding: 12px;
      background: white;
      color: var(--ink);
    }

    button {
      border: 0;
      background: var(--black);
      color: white;
      font-weight: 900;
      cursor: pointer;
    }

    button.secondary {
      border: 1px solid var(--line);
      background: white;
      color: var(--black);
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .auth-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: end;
    }

    .auth-panel {
      padding: 10px;
    }

    .auth-title {
      margin: 0 0 8px;
      color: #475569;
      font-size: 11px;
      font-weight: 950;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .auth-panel input,
    .auth-panel button {
      min-height: 42px;
      font-size: 14px;
    }

    .auth-panel label {
      margin-bottom: 4px;
      font-size: 10px;
    }

    .auth-panel .result {
      margin-top: 8px;
      padding: 9px;
      font-size: 13px;
    }

    .auth-panel.signed-in .auth-field,
    .auth-panel.signed-in #signInButton {
      display: none;
    }

    .auth-panel.signed-in .auth-grid {
      grid-template-columns: 1fr auto;
    }

    .quick-points {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 10px 0;
    }

    .quick-points button {
      border: 1px solid rgba(245, 158, 11, 0.26);
      background: #fff7d6;
      color: #92400e;
    }

    .quick-points button.active {
      border-color: var(--yellow);
      background: var(--yellow);
      color: var(--black);
    }

    .manual-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 118px;
      gap: 8px;
      margin-top: 10px;
    }

    #startButton {
      margin-top: 10px;
      background: linear-gradient(135deg, var(--yellow), var(--gold));
      color: var(--black);
    }

    #reader {
      width: 100%;
      overflow: hidden;
      margin: 0;
      border-radius: 12px;
      background: #0f172a;
    }

    #reader video {
      width: 100% !important;
      max-height: 58vh;
      object-fit: cover;
    }

    .camera-modal {
      width: min(620px, 100%);
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .camera-body {
      min-height: 0;
      overflow-y: auto;
      padding: 14px;
      background: #f8fafc;
    }

    .camera-points {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      margin-left: 5px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      color: #fde047;
      font-weight: 950;
    }

    #cameraResult {
      margin-top: 10px;
    }

    .camera-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px solid var(--line);
      padding: 10px 14px;
      background: #ffffff;
    }

    .camera-footer button {
      width: auto;
      min-width: 130px;
      min-height: 44px;
      padding: 0 16px;
    }

    .result {
      display: none;
      margin-top: 12px;
      border-radius: 10px;
      padding: 13px;
      white-space: pre-line;
      text-align: center;
      font-weight: 900;
      line-height: 1.4;
    }

    .success { display: block; background: #dcfce7; color: #14532d; border: 1px solid #86efac; }
    .error { display: block; background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .loading { display: block; background: #e0f2fe; color: #075985; border: 1px solid #bae6fd; }
    .queued { display: block; background: #fef3c7; color: #78350f; border: 1px solid #fde68a; }

    .recent {
      display: none;
      margin-top: 12px;
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }

    .recent h2 {
      margin: 0 0 8px;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .recent-item {
      margin-top: 7px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      background: white;
      font-size: 14px;
      line-height: 1.35;
    }


    .action-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .action-grid #startButton {
      margin-top: 0;
    }

    .bulk-button {
      background: linear-gradient(135deg, #111827, #374151);
      color: white;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      background: rgba(15, 23, 42, 0.62);
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: min(760px, 100%);
      max-height: 88vh;
      overflow: hidden;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 24px 72px rgba(15, 23, 42, 0.26);
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: start;
      border-bottom: 1px solid var(--line);
      padding: 14px;
      background: linear-gradient(135deg, #111827, #1f2937);
      color: white;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 20px;
      line-height: 1.1;
    }

    .modal-header p {
      margin: 5px 0 0;
      color: rgba(255, 255, 255, 0.72);
      font-size: 13px;
      font-weight: 700;
    }

    .icon-button {
      width: 42px;
      min-height: 42px;
      border: 1px solid rgba(255, 255, 255, 0.20);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.10);
      color: white;
      font-size: 22px;
      line-height: 1;
    }

    .bulk-controls {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr 0.75fr 1fr;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: #f8fafc;
    }

    .bulk-controls select,
    .bulk-controls input {
      width: 100%;
      min-height: 44px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px;
      background: white;
      color: var(--ink);
      font-size: 14px;
      font-weight: 800;
    }

    .bulk-list {
      overflow: auto;
      padding: 10px 14px;
      background: #ffffff;
    }

    .bulk-tools {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      color: #475569;
      font-size: 13px;
      font-weight: 900;
    }

    .bulk-tools button {
      width: auto;
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid var(--line);
      background: white;
      color: var(--black);
      font-size: 12px;
    }

    .student-check {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      margin-top: 7px;
      background: white;
      cursor: pointer;
    }

    .student-check input {
      width: 22px;
      min-height: 22px;
      accent-color: var(--gold);
    }

    .student-check strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
    }

    .student-check span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .bulk-footer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: center;
      border-top: 1px solid var(--line);
      padding: 12px 14px;
      background: #f8fafc;
    }

    .bulk-footer button {
      width: auto;
      min-width: 112px;
      min-height: 44px;
      padding: 0 14px;
      font-size: 14px;
    }

    #recordBulkButton.deduct-mode {
      border-color: #991b1b;
      background: linear-gradient(135deg, #dc2626, #991b1b);
      color: white;
    }

    .bulk-count {
      color: #475569;
      font-size: 13px;
      font-weight: 950;
    }

    @media (max-width: 560px) {
      main {
        padding: 10px;
      }

      .hero {
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        padding: 12px;
      }

      .eyebrow {
        padding: 4px 8px;
        font-size: 10px;
      }

      h1 {
        margin-top: 7px;
        font-size: 28px;
      }

      .credit {
        margin-top: 6px;
        font-size: 9px;
      }

      .heart-menu-button {
        width: 38px;
        min-height: 38px;
        font-size: 18px;
      }

      .heart-menu {
        top: 44px;
      }

      .auth-grid,
      .manual-row,
      .action-grid {
        grid-template-columns: 1fr;
      }

      /* Keep the Bulk Points modal usable on phones: controls stay compact
         while the student area gets most of the screen and scrolls itself. */
      .modal-backdrop {
        align-items: stretch;
        padding: 6px;
      }

      .modal {
        width: 100%;
        height: calc(100vh - 12px);
        height: calc(100dvh - 12px);
        max-height: none;
        border-radius: 14px;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
      }

      .modal-header {
        padding: 10px 11px;
        align-items: center;
      }

      .modal-header h2 {
        font-size: 18px;
      }

      .modal-header p {
        margin-top: 3px;
        font-size: 11px;
        line-height: 1.25;
      }

      .icon-button {
        width: 38px;
        min-height: 38px;
        flex: 0 0 38px;
      }

      .bulk-controls {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px 8px;
        padding: 7px 9px 8px;
      }

      .bulk-controls label {
        display: block;
        margin-bottom: 2px;
        font-size: 10px;
        line-height: 1.1;
      }

      .bulk-controls select,
      .bulk-controls input {
        min-height: 38px;
        padding: 7px 8px;
        border-radius: 9px;
        font-size: 12px;
      }

      .bulk-list {
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        padding: 6px 9px 10px;
      }

      .bulk-tools {
        position: sticky;
        top: -6px;
        z-index: 2;
        gap: 5px;
        margin: 0 -1px 5px;
        padding: 6px 1px 5px;
        background: #ffffff;
        font-size: 11px;
      }

      .bulk-tools > span:last-child {
        display: flex;
        gap: 4px;
      }

      .bulk-tools button {
        min-height: 32px;
        padding: 0 8px;
        font-size: 10px;
      }

      .student-check {
        gap: 8px;
        min-height: 52px;
        padding: 7px 9px;
        margin-top: 5px;
        border-radius: 9px;
      }

      .student-check input {
        width: 24px;
        min-height: 24px;
      }

      .student-check strong {
        font-size: 13px;
      }

      .student-check span {
        margin-top: 1px;
        font-size: 10px;
        line-height: 1.2;
      }

      .bulk-footer {
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 6px;
        padding: 8px 9px;
      }

      .bulk-footer button {
        width: auto;
        min-width: 0;
        min-height: 40px;
        padding: 0 10px;
        font-size: 12px;
      }

      .bulk-count {
        font-size: 11px;
      }

      .camera-modal {
        height: auto;
        max-height: calc(100dvh - 12px);
      }

      .camera-body {
        padding: 8px;
      }

      #reader video {
        max-height: 62dvh;
      }

      .camera-footer {
        padding: 8px 9px;
      }

      .camera-footer button {
        width: 100%;
        min-height: 42px;
      }

      .home-link {
        width: fit-content;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div>
        <div class="eyebrow">Recitation Central</div>
        <h1>Scanner</h1>
        <div class="credit">Developed by Mr. John Rey Tubello (Sir JR)</div>
      </div>
      <div class="header-menu-wrap">
        <button id="heartMenuButton" class="heart-menu-button" type="button" aria-label="Open scanner menu" aria-expanded="false">♥</button>
        <div id="heartMenu" class="heart-menu" hidden>
          <a class="menu-home-link" href="firebase-index.html">Home</a>
          <section id="authPanel" class="auth-panel">
            <div class="auth-title">Teacher Sign In</div>
            <div class="auth-grid">
              <div class="auth-field">
                <label for="teacherEmail">Email</label>
                <input id="teacherEmail" type="email" autocomplete="username" placeholder="Teacher email">
              </div>
              <div class="auth-field">
                <label for="teacherPassword">Password</label>
                <input id="teacherPassword" type="password" autocomplete="current-password" placeholder="Password">
              </div>
              <button id="signInButton" type="button">Sign In</button>
              <button id="signOutButton" class="secondary" type="button" hidden>Sign Out</button>
            </div>
            <div id="authResult" class="result"></div>
          </section>
        </div>
      </div>
    </section>

    <section id="scannerPanel" class="panel" hidden>
      <label for="points">Points</label>
      <input id="points" type="number" min="1" value="1">

      <div class="quick-points">
        <button class="quick-point active" type="button" data-points="1">+1</button>
        <button class="quick-point" type="button" data-points="2">+2</button>
        <button class="quick-point" type="button" data-points="3">+3</button>
        <button class="quick-point" type="button" data-points="5">+5</button>
      </div>

      <div class="manual-row">
        <input id="manualStudentId" type="text" placeholder="Type Student ID manually">
        <button id="manualButton" type="button">Record</button>
      </div>

      <div class="action-grid">
        <button id="startButton" type="button">Start Camera Scanner</button>
        <button id="bulkButton" class="bulk-button" type="button">Bulk Points</button>
      </div>
      <div id="result" class="result"></div>

      <div id="recentPanel" class="recent">
        <h2>Recent Records</h2>
        <div id="recentList"></div>
      </div>
    </section>

    <div id="cameraModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="cameraTitle">
      <section class="modal camera-modal">
        <div class="modal-header">
          <div>
            <h2 id="cameraTitle">Camera Scanner</h2>
            <p>Point per successful scan:<span id="cameraPointsLabel" class="camera-points">+1</span></p>
          </div>
          <button id="closeCameraButton" class="icon-button" type="button" aria-label="Close camera scanner">×</button>
        </div>

        <div class="camera-body">
          <div id="reader"></div>
          <div id="cameraResult" class="result"></div>
        </div>

        <div class="camera-footer">
          <button id="closeCameraFooterButton" class="secondary" type="button">Close Camera</button>
        </div>
      </section>
    </div>

    <div id="bulkModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="bulkTitle">
      <section class="modal">
        <div class="modal-header">
          <div>
            <h2 id="bulkTitle">Bulk Points</h2>
            <p>Select students, choose Add or Deduct, set points, then apply once.</p>
          </div>
          <button id="closeBulkButton" class="icon-button" type="button" aria-label="Close bulk points">×</button>
        </div>

        <div class="bulk-controls">
          <div>
            <label for="bulkAction">Action</label>
            <select id="bulkAction">
              <option value="add">Add Points (+)</option>
              <option value="deduct">Deduct Points (-)</option>
            </select>
          </div>
          <div>
            <label for="bulkSectionFilter">Section</label>
            <select id="bulkSectionFilter"></select>
          </div>
          <div>
            <label for="bulkPoints">Points</label>
            <input id="bulkPoints" type="number" min="1" step="1" value="1">
          </div>
          <div>
            <label for="bulkSearch">Search</label>
            <input id="bulkSearch" type="search" placeholder="Name or Student ID">
          </div>
        </div>

        <div class="bulk-list">
          <div class="bulk-tools">
            <span id="bulkStatus">Loading students...</span>
            <span>
              <button id="selectVisibleButton" type="button">Select Visible</button>
              <button id="clearSelectedButton" type="button">Clear</button>

    const DEFAULT_TERM_CALENDAR = Object.freeze({
      term1Start: "2026-06-01",
      term2Start: "2026-09-07",
      term3Start: "2027-01-04"
    });
    const TERM_CALENDAR_STORAGE_KEY = "recitationTermCalendarV1";
    let termCalendar = loadCachedTermCalendar();

    function normalizeDateKey(value) {
      const text = String(value || "").trim();
      if (!/^\d{4}-\d{2}-\d{2}$/.test(text)) return "";
      const [year, month, day] = text.split("-").map(Number);
      const parsed = new Date(year, month - 1, day);
      if (
        parsed.getFullYear() !== year ||
        parsed.getMonth() !== month - 1 ||
        parsed.getDate() !== day
      ) return "";
      return text;
    }

    function isValidTermCalendar(calendar) {
      const t1 = normalizeDateKey(calendar && calendar.term1Start);
      const t2 = normalizeDateKey(calendar && calendar.term2Start);
      const t3 = normalizeDateKey(calendar && calendar.term3Start);
      return Boolean(t1 && t2 && t3 && t1 < t2 && t2 < t3);
    }

    function normalizeTermCalendar(data) {
      const candidate = {
        term1Start: normalizeDateKey(data && data.term1Start),
        term2Start: normalizeDateKey(data && data.term2Start),
        term3Start: normalizeDateKey(data && data.term3Start)
      };
      return isValidTermCalendar(candidate) ? candidate : { ...DEFAULT_TERM_CALENDAR };
    }

    function loadCachedTermCalendar() {
      try {
        const cached = JSON.parse(localStorage.getItem(TERM_CALENDAR_STORAGE_KEY) || "null");
        return normalizeTermCalendar(cached);
      } catch (error) {
        return { ...DEFAULT_TERM_CALENDAR };
      }
    }

    function cacheTermCalendar(calendar) {
      try {
        localStorage.setItem(TERM_CALENDAR_STORAGE_KEY, JSON.stringify(calendar));
      } catch (error) {}
    }

    function dateKeyFromDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function nextSchoolYearStartKey() {
      const [year, month, day] = termCalendar.term1Start.split("-").map(Number);
      const next = new Date(year + 1, month - 1, day);
      return dateKeyFromDate(next);
    }

    function configuredSchoolYear() {
      const startYear = Number(termCalendar.term1Start.slice(0, 4));
      return startYear + "-" + (startYear + 1);
    }

    function getTermInfo(date = new Date()) {
      const key = dateKeyFromDate(date);
      const schoolYear = configuredSchoolYear();
      const nextTerm1Start = nextSchoolYearStartKey();

      if (key >= termCalendar.term1Start && key < termCalendar.term2Start) {
        return { id: "term1", name: "Term 1", schoolYear };
      }

      if (key >= termCalendar.term2Start && key < termCalendar.term3Start) {
        return { id: "term2", name: "Term 2", schoolYear };
      }

      if (key >= termCalendar.term3Start && key < nextTerm1Start) {
        return { id: "term3", name: "Term 3", schoolYear };
      }

      return { id: "outOfTerm", name: "Outside Term", schoolYear };
    }

    function subscribeTermCalendar() {
      if (unsubscribeTermCalendar) unsubscribeTermCalendar();
      unsubscribeTermCalendar = onSnapshot(doc(db, "settings", "termCalendar"), (snapshot) => {
        if (!snapshot.exists()) return;
        termCalendar = normalizeTermCalendar(snapshot.data() || {});
        cacheTermCalendar(termCalendar);
      }, (error) => {
        console.warn("Term calendar unavailable; using cached/default dates.", error);
      });
    }

    function unlockFeedback() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      if (!audioContext) audioContext = new AudioContext();
      if (audioContext.state === "suspended") audioContext.resume().catch(() => {});
    }

    function beep(frequency, duration, volume) {
      if (!audioContext || audioContext.state !== "running") return;
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = "sine";
      oscillator.frequency.value = frequency;
      gain.gain.value = volume;
      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start();
      setTimeout(() => oscillator.stop(), duration);
    }

    function successFeedback() {
      unlockFeedback();
      beep(740, 80, 0.08);

    function normalizeSection(value) {
      return String(value || "").trim();
    }

    function sortStudentsBySectionName(a, b) {
      const sectionCompare = normalizeSection(a.section).localeCompare(normalizeSection(b.section), undefined, { sensitivity: "base" });
      if (sectionCompare !== 0) return sectionCompare;
      return String(a.fullName || "").localeCompare(String(b.fullName || ""), undefined, { sensitivity: "base" });
    }

    function getVisibleBulkStudents() {
      const selectedSection = bulkSectionFilter.value;
      const searchText = bulkSearch.value.trim().toLowerCase();

      return bulkStudents.filter((student) => {
        const sectionOk = !selectedSection || student.section === selectedSection;
        if (!sectionOk) return false;
        if (!searchText) return true;

        const haystack = [student.id, student.fullName, student.section].join(" ").toLowerCase();
        return haystack.includes(searchText);
      });
    }

    function getSelectedBulkIds() {
      return Array.from(bulkSelectedIds);
    }

    function editableBulkTermPoints(student, termId) {
      if (!student) return 0;
      const termTotals = student.termTotals || {};
      const explicitTermPoints = Number(termTotals[termId]) || 0;

      if (termId === "term1") {
        const assignedTermPoints = ["term1", "term2", "term3", "outOfTerm"].reduce((total, key) => {
          return total + (Number(termTotals[key]) || 0);
        }, 0);
        const legacyUnassignedPoints = Math.max(0, (Number(student.totalPoints) || 0) - assignedTermPoints);
        return explicitTermPoints + legacyUnassignedPoints;
      }

      return explicitTermPoints;
    }

    function populateBulkSections() {
      const currentValue = bulkSectionFilter.value;
      const sections = Array.from(new Set(bulkStudents.map((student) => student.section).filter(Boolean))).sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));

    async function loadBulkStudents(force = false) {
      if (bulkLoaded && !force) {
        populateBulkSections();
        renderBulkStudents();
        return;

      bulkStudentList.innerHTML = "";

      const snapshot = await getDocs(collection(db, "students"));

          id: studentDoc.id,
          fullName: data.fullName || "",

      bulkLoaded = true;
      populateBulkSections();
      renderBulkStudents();

    async function recordBulkRecitation() {
      if (bulkBusy) return;

      if (!auth.currentUser) {
        showResult("error", "Please sign in first before recording.");
        return;
      }

      const selectedIds = getSelectedBulkIds();
      const pointAmount = Number(bulkPoints.value);
      const action = bulkAction.value === "deduct" ? "deduct" : "add";
      const pointChange = action === "deduct" ? -pointAmount : pointAmount;
      const term = getTermInfo();
      const termField = "termTotals." + term.id;
      const activity = action === "deduct" ? "Bulk Point Deduction" : getDefaultActivityName() + " - Bulk";

      if (!selectedIds.length) {
        bulkStatus.textContent = "Please select at least one student.";
        return;
      }

      if (!Number.isFinite(pointAmount) || pointAmount <= 0 || !Number.isInteger(pointAmount)) {
        bulkStatus.textContent = "Enter a whole number of points greater than 0.";
        return;
      }

      bulkBusy = true;
      recordBulkButton.disabled = true;
      cancelBulkButton.disabled = true;
      closeBulkButton.disabled = true;

      try {
        let selectedStudents;

        if (action === "deduct") {
          bulkStatus.textContent = "Checking current points before deduction...";
          const freshSnapshot = await getDocs(collection(db, "students"));
          const freshStudentMap = new Map(freshSnapshot.docs.map((studentDoc) => {
            const data = studentDoc.data() || {};
            return [studentDoc.id, {
              id: studentDoc.id,
              fullName: data.fullName || "",
              section: data.section || "",
              gender: data.gender || data.sex || "",
              totalPoints: Number(data.totalPoints) || 0,
              termTotals: data.termTotals || {}
            }];
          }));

          selectedStudents = selectedIds.map((id) => freshStudentMap.get(id)).filter(Boolean);
          const missingStudents = selectedIds.filter((id) => !freshStudentMap.has(id));
          if (missingStudents.length) {
            throw new Error(missingStudents.length + " selected student record(s) could not be found. Refresh Bulk Points and try again.");
          }

          const insufficient = selectedStudents.filter((student) => {
            const termPoints = editableBulkTermPoints(student, term.id);
            const allTimePoints = Number(student.totalPoints) || 0;
            return termPoints < pointAmount || allTimePoints < pointAmount;
          });

          if (insufficient.length) {
            const preview = insufficient.slice(0, 5).map((student) => {
              return (student.fullName || student.id) + " (" + editableBulkTermPoints(student, term.id) + " pts)";
            }).join(", ");
            const moreText = insufficient.length > 5 ? " +" + (insufficient.length - 5) + " more" : "";
            bulkStatus.textContent = "Deduction blocked: " + insufficient.length + " selected student(s) do not have enough " + term.name + " points.";
            showResult("error", "Bulk deduction was not applied.\n" + insufficient.length + " selected student(s) have fewer than " + pointAmount + " points in " + term.name + ".\n" + preview + moreText);
            errorFeedback();
            return;
          }
        } else {
          const studentMap = new Map(bulkStudents.map((student) => [student.id, student]));
          selectedStudents = selectedIds.map((id) => studentMap.get(id)).filter(Boolean);
        }

        const verb = action === "deduct" ? "DEDUCT" : "ADD";
        const direction = action === "deduct" ? " from " : " to ";
        const confirmed = confirm(
          verb + " " + pointAmount + " point" + (pointAmount === 1 ? "" : "s") + direction +
          selectedStudents.length + " student" + (selectedStudents.length === 1 ? "" : "s") + "?\n\n" +
          "Term: " + term.name + "\n" +
          (action === "deduct" ? "Scores will never be allowed to go below 0." : "This will update the leaderboard immediately.")
        );
        if (!confirmed) return;

        bulkStatus.textContent = action === "deduct" ? "Applying bulk deduction..." : "Recording bulk points...";
        const chunkSize = 200;

        for (let start = 0; start < selectedStudents.length; start += chunkSize) {
          const chunk = selectedStudents.slice(start, start + chunkSize);
          const batch = writeBatch(db);

          chunk.forEach((student) => {
            const studentRef = doc(db, "students", student.id);
            const logRef = doc(collection(db, "recitationLogs"));

            if (action === "deduct") {
              const currentTermTotal = editableBulkTermPoints(student, term.id);
              const currentAllTimeTotal = Number(student.totalPoints) || 0;
              batch.update(studentRef, {
                totalPoints: currentAllTimeTotal - pointAmount,
                [termField]: currentTermTotal - pointAmount,
                latestAt: serverTimestamp(),
                latestPoints: pointChange,
                latestTermId: term.id,
                latestTermName: term.name,
                updatedAt: serverTimestamp()
              });
            } else {
              batch.update(studentRef, {
                totalPoints: increment(pointAmount),
                [termField]: increment(pointAmount),
                latestAt: serverTimestamp(),
                latestPoints: pointAmount,
                latestTermId: term.id,
                latestTermName: term.name,
                updatedAt: serverTimestamp()
              });
            }

            batch.set(logRef, {
              studentId: student.id,
              fullName: student.fullName || "",
              section: student.section || "",
              points: pointChange,
              activity,
              termId: term.id,
              termName: term.name,
              schoolYear: term.schoolYear,
              bulk: true,
              bulkDeduction: action === "deduct",
              adjustedBy: auth.currentUser.email || "",
              createdAt: serverTimestamp()
            });
          });

          await batch.commit();
        }

        const sign = action === "deduct" ? "-" : "+";
        showResult("success", (action === "deduct" ? "Bulk deduction applied: " : "Bulk points added: ") + sign + pointAmount + " to " + selectedStudents.length + " student" + (selectedStudents.length === 1 ? "" : "s") + ".\n" + term.name + " | Leaderboard updates live.");
        addRecent((action === "deduct" ? "Bulk Deduction: " : "Bulk Recitation: ") + selectedStudents.length + " student" + (selectedStudents.length === 1 ? "" : "s") + " " + sign + pointAmount + "\n" + term.name);
        bulkSelectedIds.clear();
        bulkLoaded = false;
        closeBulkModal(true);
        successFeedback();
      } catch (error) {
        showResult("error", (action === "deduct" ? "Bulk deduction failed:\n" : "Bulk save failed:\n") + error.message);
        bulkStatus.textContent = action === "deduct" ? "Bulk deduction failed." : "Bulk save failed.";
        errorFeedback();
      } finally {
        bulkBusy = false;
        recordBulkButton.disabled = false;
        cancelBulkButton.disabled = false;
        closeBulkButton.disabled = false;
      }
    }

    async function recordStudent(studentIdValue, source = "manual") {
      unlockFeedback();
      cleanupLocks();

      if (!auth.currentUser) {
        showResult("error", "Please sign in first before recording.");
        errorFeedback();
        return false;
      }

      const studentId = normalizeStudentId(studentIdValue);
      const points = Number(pointsInput.value);
      const activity = getDefaultActivityName();
      const term = getTermInfo();
      const termField = "termTotals." + term.id;

      if (!studentId) {
        showResult("error", "Please scan or type a Student ID.");
        errorFeedback();
        return false;
      }

      if (!Number.isFinite(points) || points <= 0) {
        showResult("error", "Invalid points.");
        errorFeedback();
        return false;
      }

      const lockKey = buildLockKey(studentId);
      if (isSameStudentWaitActive(lockKey)) {
        showSameStudentWait(lockKey);
        return false;
      }

      showResult("loading", "Saving " + studentId + "...");

      try {
        const studentRef = doc(db, "students", studentId);
        const studentSnap = await getDoc(studentRef);

        if (!studentSnap.exists()) {
          showResult("error", "Student ID not found: " + studentId);
          errorFeedback();
          return false;
        }

        const student = studentSnap.data() || {};
        const logRef = doc(collection(db, "recitationLogs"));

        await runTransaction(db, async (transaction) => {
          transaction.update(studentRef, {
            totalPoints: increment(points),
            [termField]: increment(points),
            latestAt: serverTimestamp(),
            latestPoints: points,
            latestTermId: term.id,
            latestTermName: term.name,
            updatedAt: serverTimestamp()
          });

          transaction.set(logRef, {
            studentId,
            fullName: student.fullName || "",
            section: student.section || "",
            points,
            activity,
            termId: term.id,
            termName: term.name,
            schoolYear: term.schoolYear,
            createdAt: serverTimestamp()
          });
        });

        const displayName = student.fullName || studentId;
        showResult("success", "Recorded: " + displayName + " +" + points + "\n" + term.name + " | Leaderboard updates live.");
        addRecent(displayName + " +" + points + "\n" + (student.section || "") + " | " + term.name);
        markAcceptedStudent(lockKey);
        successFeedback();
        return true;
      } catch (error) {
        showResult("error", "Save failed:\n" + error.message);
        errorFeedback();
        return false;
      }
    }

    async function stopScannerIfNeeded() {
      if (!scannerStarted) {
        if (!scannerStarting) startButton.disabled = false;
        return;
      }

      try {
        await scanner.stop();
      } catch (error) {
        // Scanner may already be stopped.
      }

      try {
        scanner.clear();
      } catch (error) {
        // Reader may already be clear.
      }

      scannerStarted = false;
      scanPauseActive = false;
      cameraScanBusy = false;
      startButton.disabled = false;
    }

    async function closeCameraModal() {
      cameraModal.classList.remove("open");
      resetHeldCameraScan();
      await stopScannerIfNeeded();
      cameraResult.className = "result";
      cameraResult.textContent = "";
    }

    async function openCameraModal() {
      if (!auth.currentUser) {
        showResult("error", "Please sign in first before starting the camera scanner.");
        return;
      }

      updateQuickPointButtons();
      cameraResult.className = "result loading";
      cameraResult.textContent = "Starting camera...";
      cameraModal.classList.add("open");
      await startScanner();
    }

    async function signInTeacher() {
      const email = teacherEmail.value.trim();
      const password = teacherPassword.value;

      if (!email || !password) {
        showAuth("error", "Teacher email and password are required.");
        return;
      }

      signInButton.disabled = true;
      showAuth("loading", "Signing in...");

      try {
        await signInWithEmailAndPassword(auth, email, password);
        setHeartMenu(false);
        teacherPassword.value = "";
      } catch (error) {
        showAuth("error", "Sign in failed:\n" + error.message);
      } finally {
        signInButton.disabled = false;
      }
    }

    async function signOutTeacher() {
      await stopScannerIfNeeded();
      await signOut(auth);
    }

    function pauseScannerBriefly() {
      if (!scannerStarted || scanPauseActive) return;
      scanPauseActive = true;

      try {
        scanner.pause(true);
      } catch (error) {
        // Scanner may already be pausing.
      }

      setTimeout(() => {
        scanPauseActive = false;
        if (!scannerStarted) return;

        try {
          scanner.resume();
        } catch (error) {
          // Scanner may already be running.
        }
      }, SCANNER_PAUSE_MS);
    }

    async function startScanner() {
      if (scannerStarted || scannerStarting) return;
      unlockFeedback();
      scannerStarting = true;
      startButton.disabled = true;
      showResult("loading", "Starting camera...");

      try {
        await scanner.start(
          { facingMode: "environment" },
          { fps: 15, qrbox: { width: 220, height: 220 }, aspectRatio: 1, disableFlip: true },
          async (decodedText) => {
            if (scanPauseActive || cameraScanBusy) return;
            if (shouldIgnoreHeldCameraScan(decodedText)) return;

            cameraScanBusy = true;
            try {
              const accepted = await recordStudent(decodedText, "camera");
              if (accepted) pauseScannerBriefly();
            } finally {
              cameraScanBusy = false;
            }
          }
        );

        scannerStarted = true;

        if (!cameraModal.classList.contains("open")) {
          await stopScannerIfNeeded();
          return;
        }

        showResult("success", "Camera scanner ready. Point the QR code inside the scanner.");
      } catch (error) {
        startButton.disabled = false;
        showResult("error", "Camera Error:\n" + error.message);
      } finally {
        scannerStarting = false;
        if (!scannerStarted) startButton.disabled = false;
      }
    }

    manualButton.addEventListener("click", () => {
      const studentId = manualStudentId.value;
      manualStudentId.value = "";
      resetHeldCameraScan();
      recordStudent(studentId, "manual");
    });

    manualStudentId.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        const studentId = manualStudentId.value;
        manualStudentId.value = "";
        resetHeldCameraScan();
        recordStudent(studentId, "manual");
      }
    });

    startButton.addEventListener("click", openCameraModal);
    closeCameraButton.addEventListener("click", closeCameraModal);
    closeCameraFooterButton.addEventListener("click", closeCameraModal);
    cameraModal.addEventListener("click", (event) => {
      if (event.target === cameraModal) closeCameraModal();
    });
    bulkButton.addEventListener("click", openBulkModal);
    closeBulkButton.addEventListener("click", () => closeBulkModal());
    cancelBulkButton.addEventListener("click", () => closeBulkModal());
    bulkModal.addEventListener("click", (event) => {
      if (event.target === bulkModal) closeBulkModal();
    });
    bulkAction.addEventListener("change", updateBulkActionUI);
    bulkSectionFilter.addEventListener("change", renderBulkStudents);
    bulkSearch.addEventListener("input", renderBulkStudents);
    selectVisibleButton.addEventListener("click", selectVisibleBulkStudents);
    clearSelectedButton.addEventListener("click", clearBulkSelection);
    recordBulkButton.addEventListener("click", recordBulkRecitation);
    heartMenuButton.addEventListener("click", (event) => {
      event.stopPropagation();
      toggleHeartMenu();
    });

    heartMenu.addEventListener("click", (event) => {
      event.stopPropagation();
    });

    document.addEventListener("click", () => {
      setHeartMenu(false);
    });

    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      setHeartMenu(false);
      if (cameraModal.classList.contains("open")) closeCameraModal();
      if (bulkModal.classList.contains("open")) closeBulkModal();
    });

    signInButton.addEventListener("click", signInTeacher);
    signOutButton.addEventListener("click", signOutTeacher);
    teacherPassword.addEventListener("keydown", (event) => {
      if (event.key === "Enter") signInTeacher();
    });
    pointsInput.addEventListener("input", updateQuickPointButtons);
    quickPointButtons.forEach((button) => {
      button.addEventListener("click", () => {
        unlockFeedback();
        pointsInput.value = button.dataset.points;
        updateQuickPointButtons();
      });
    });

    onAuthStateChanged(auth, (user) => {
      const signedIn = Boolean(user);
      authPanel.classList.toggle("signed-in", signedIn);
      scannerPanel.hidden = !signedIn;
      signOutButton.hidden = !signedIn;
      signInButton.hidden = signedIn;
      teacherEmail.disabled = signedIn;
      teacherPassword.disabled = signedIn;

      if (signedIn) {
        showAuth("success", "Signed in: " + user.email);
        subscribeTermCalendar();
      } else {
        if (unsubscribeTermCalendar) unsubscribeTermCalendar();
        unsubscribeTermCalendar = null;
        closeCameraModal();
        closeBulkModal();
        bulkLoaded = false;
        bulkStudents = [];
        bulkSelectedIds.clear();
        showAuth("queued", "Sign in required before scanning.");
      }
    });
  </script>
</body>
</html>
